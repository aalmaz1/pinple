name: pinple
description: "공주대학교 천안캠퍼스 전용 소모임 앱"
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.7.0

  # Media
  image_picker: ^1.1.2
  share_plus: ^10.1.4

  # State Management
  flutter_riverpod: ^3.4.3

  # Navigation
  go_router: ^18.0.1
  app_links: ^6.3.3

  # Map
  flutter_naver_map: ^1.2.0

  # Location
  geolocator: ^14.0.2

  # Fonts
  google_fonts: ^8.2.1

  # Settings
  shared_preferences: ^2.3.5
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/app_icon.webp"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
