name: pinple
description: "공주대학교 천안캠퍼스 전용 소모임 앱"
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  firebase_storage: ^12.3.2

  # Media
  image_picker: ^1.1.2

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^17.2.0

  # Map
  flutter_naver_map: ^1.2.0

  # Location
  geolocator: ^14.0.2

  # Fonts
  google_fonts: ^6.2.1

  # Settings
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/app_icon.webp"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
