name: pinple
description: "공주대학교 천안캠퍼스 전용 소모임 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase — pinned for reproducible builds & supply-chain safety
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0

  # State Management
  flutter_riverpod: ^3.3.1

  # Navigation
  go_router: ^17.2.0

  # Map
  flutter_naver_map: ^1.4.4

  # Location — geolocator handles permission internally, permission_handler not needed
  geolocator: ^14.0.2

  # Fonts — consider bundling NotoSansKR locally instead of google_fonts for offline-first
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
